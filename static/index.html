<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RE News">
<title>RE News Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#68707a;--line:#e3e6ea;--accent:#1f5fbf;
--residential:#2e7d32;--office:#5c6bc0;--industrial:#8d6e63;--retail:#c2185b;--land:#ef6c00;--policy:#455a64;--infra:#00838f;
--sig:#eef3fb}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1e23;--ink:#e7e9ec;--mute:#9aa3ad;--line:#2c3138;--accent:#6ea2ff;--sig:#1f2836}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:17px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input[type=search]{flex:1;min-width:200px}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px;user-select:none;background:var(--card)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip .n{color:var(--mute);margin-left:4px}.chip.on .n{color:inherit;opacity:.7}
main{max-width:1000px;margin:0 auto;padding:12px 16px 60px}
.meta{color:var(--mute);font-size:12.5px;margin:6px 0 10px}
.art{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:8px}
.art a.t{color:var(--ink);font-weight:600;font-size:15px;text-decoration:none}.art a.t:hover{color:var(--accent)}
.art .s{color:var(--mute);margin:4px 0 6px;font-size:13px}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:11.5px}
.seg{color:#fff;border-radius:4px;padding:1px 7px}
.sig{background:var(--sig);border-radius:4px;padding:1px 7px}
.src{color:var(--mute);margin-left:auto}
.star{cursor:pointer;border:none;background:none;font-size:16px;padding:0 4px;color:var(--mute)}.star.on{color:#f5a623}
.prov{border:1px solid var(--infra);color:var(--infra);border-radius:4px;padding:0 6px}
.promo{background:#fff3cd;color:#7a5b00;border-radius:4px;padding:1px 7px;font-weight:600}
@media (prefers-color-scheme:dark){.promo{background:#4a3b00;color:#ffe08a}}
.art.isPromo{opacity:.75}
.prio{font-weight:700;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left;vertical-align:top}
.ok{color:var(--residential)}.err{color:#d32f2f}
.empty{color:var(--mute);text-align:center;padding:40px}
.also{font-size:12px;color:var(--mute);margin-top:5px}.also a{color:var(--mute)}
.online #fetchBtn,.online #srcPanel .row,.online #srcTable button,.online #addResult{display:none}
#tabs{display:flex;gap:4px;margin:0 0 10px;overflow-x:auto}
#tabs button{border:none;background:none;padding:6px 10px;border-radius:6px;font-weight:600;color:var(--mute);white-space:nowrap}
#tabs button.on{background:var(--ink);color:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;overflow-x:auto}
.card a{color:var(--ink)}
.ptable td{font-size:13px}
.relb{border:1px dashed var(--mute);color:var(--mute);border-radius:4px;padding:0 6px}
.off{background:#e8eaf6;color:#283593;border-radius:4px;padding:1px 7px;font-weight:600}
@media (prefers-color-scheme:dark){.off{background:#283046;color:#c5cae9}}
#filterBtn{display:none}
.notice{background:var(--sig);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13px}
.notice.err{background:#fdecea;color:#b71c1c}
/* phone layout */
@media (max-width:700px){
  header{position:static;padding:10px 12px}
  main{padding:10px 12px 60px}
  h1{display:flex;justify-content:space-between;align-items:center}
  #filterBtn{display:inline-block;font-size:13px}
  input,select,button{font-size:16px}  /* stops iPhone zooming into fields */
  input[type=search]{min-width:0;width:100%}
  #filters{display:none}
  #filters.open{display:flex}
  #filters select{flex:1 1 46%;min-width:0}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap}
  .art{padding:10px}
  .art a.t{font-size:16px;line-height:1.35}
  .src{margin-left:0;width:100%}
  #srcTable tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  #srcTable td,#srcTable th{display:block;border:none;padding:2px 0}
  #srcTable tr:first-child{display:none}
  #srcPanel .row input{flex:1 1 100%}
}
</style>
</head>
<body>
<header>
  <h1>Real Estate News Tracker <button id="filterBtn">Filters ▾</button></h1>
  <nav id="tabs"><button data-tab="news" class="on">News</button><button data-tab="prices">Prices</button><button data-tab="legal">Legal</button><button data-tab="developers">Developers</button><button data-tab="digest">Digest</button><button data-tab="reports">Reports</button></nav>
  <div id="newsControls">
  <div class="row">
    <input type="search" id="q" placeholder="Search (accents optional: 'gia dat' finds 'giá đất')">
  </div>
  <div class="row" id="filters" style="margin-top:8px">
    <select id="days"><option value="">Any time</option><option value="1">24 hours</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="90">90 days</option></select>
    <select id="area"><option value="">All provinces</option></select>
    <select id="promo"><option value="">Promotional: show, flagged</option><option value="hide">Promotional: hide</option><option value="only">Promotional only</option></select>
    <select id="rel"><option value="re">Real estate articles</option><option value="core">Real estate headlines only</option><option value="all">Everything, incl. off-topic</option></select>
    <select id="dups"><option value="">Same story once</option><option value="show">Show every copy</option></select>
    <select id="kind"><option value="">News + official</option><option value="news">News only</option><option value="official">Official sources only</option></select>
    <select id="source"><option value="">All sources</option></select>
    <select id="sort"><option value="priority">Priority first</option><option value="date">Newest first</option></select>
    <label class="chip" id="starredChip">★ Starred</label>
    <button class="primary" id="fetchBtn">Fetch now</button>
    <a href="/api/export.csv"><button>Export CSV</button></a>
  </div>
  <div class="chips" id="segChips"></div>
  <div class="chips" id="sigChips"></div>
</div>
</header>
<main>
  <div id="toolView" style="display:none"></div>
  <div id="newsView">
  <details id="srcPanel"><summary>Sources <span id="srcSummary" class="meta"></span></summary>
    <table id="srcTable"></table>
    <div class="row" style="margin-top:8px">
      <input id="newUrl" placeholder="Paste a link: RSS feed or a news section page" style="flex:1;min-width:220px">
      <input id="newName" placeholder="Name (optional)">
      <label class="meta" style="margin:0"><input type="checkbox" id="newOfficial"> Government source</label>
      <button id="addSrc" class="primary">Add source</button>
    </div>
    <div id="addResult"></div>
  </details>
  <div class="notice" id="phoneHint" style="display:none"></div>
  <div class="meta" id="count"></div>
  <div id="list"></div>
  </div>
</main>
<script>
const SEG_LABEL={residential:"Residential",office:"Office",industrial:"Industrial",retail:"Retail",land:"Land",policy:"Policy",infra:"Planning & infrastructure"};
const SIG_LABEL={deal:"Deals / M&A",pricing:"Pricing & rents",supply:"Supply & new projects",developer:"Developers",financing:"Financing & bonds",legal_doc:"Legal documents"};
const state={segment:"",signal:"",type:"",starred:false};
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chips(el,labels,counts,key){
  el.innerHTML=`<span class="meta" style="margin:0 4px 0 0">${key==="segment"?"Property":"News type"}:</span>`+
    Object.entries(labels).map(([k,v])=>`<span class="chip ${state[key]===k?"on":""}" data-k="${k}">${v}<span class="n">${counts[k]||0}</span></span>`).join("");
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{state[key]=state[key]===c.dataset.k?"":c.dataset.k;load();});
}

async function loadStats(){
  const s=await (await fetch("/api/stats")).json();
  chips($("segChips"),SEG_LABEL,s.segments,"segment");
  chips($("sigChips"),s.type_labels||{},s.types||{},"type");
  const ca=$("area").value;
  const regs={North:[],Central:[],South:[]};Object.entries(s.regions).forEach(([p,r])=>regs[r].push(p));
  $("area").innerHTML='<option value="">All provinces</option>'+Object.entries(regs).map(([r,ps])=>
    `<optgroup label="${r}"><option value="region:${r}" ${ca==="region:"+r?"selected":""}>All ${r} (priority)</option>`+
    ps.map(p=>`<option value="${p}" ${ca===p?"selected":""}>${p} (${s.provinces[p]||0})</option>`).join("")+"</optgroup>").join("");
  $("promo").options[2].textContent=`Promotional only (${s.promo})`;
  const cur=$("source").value;
  $("source").innerHTML='<option value="">All sources</option>'+s.source_names.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("");
  const cfg=await (await fetch("/api/sources")).json();
  const st=Object.fromEntries(s.sources.map(x=>[x.url,x]));
  const okN=s.sources.filter(x=>x.ok).length;
  const offN=(s.relevance||{}).off||0;
  $("srcSummary").textContent=` ${cfg.sources.length} sources, ${okN} working at last fetch, ${s.total} articles stored (${offN} off-topic and ${s.dups} repeat copies hidden)`;
  $("srcTable").innerHTML="<tr><th>Feed</th><th>Last fetch</th><th>Status</th><th></th></tr>"+cfg.sources.map(x=>{
    const r=st[x.url];
    return `<tr><td>${esc(x.name)} <span class="meta">${x.type==="html"?"(page reader)":"(RSS)"}${x.official?" · 🏛 official":""}</span><br><span class="meta">${esc(x.url)}</span></td>
      <td>${r?new Date(r.last_run).toLocaleString():"never"}</td>
      <td>${!x.enabled?"paused":r?(r.ok?`<span class="ok">OK, ${r.new_items} new</span>`:`<span class="err">${esc(r.message)}</span>`):"–"}</td>
      <td><button data-a="toggle" data-u="${esc(x.url)}">${x.enabled?"Pause":"Resume"}</button> <button data-a="remove" data-u="${esc(x.url)}">Remove</button></td></tr>`}).join("");
  $("srcTable").querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    if(b.dataset.a==="remove"&&!confirm("Remove this feed? Stored articles stay."))return;
    await post("/api/sources",{action:b.dataset.a,url:b.dataset.u});loadStats();});
}

async function post(u,b){return (await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})).json();}

async function load(){
  const av=$("area").value;
  const p=new URLSearchParams({q:$("q").value,promo:$("promo").value,kind:$("kind").value,relevance:$("rel").value,dups:$("dups").value,
    province:av.startsWith("region:")?"":av,region:av.startsWith("region:")?av.slice(7):"",days:$("days").value,source:$("source").value,sort:$("sort").value,
    segment:state.segment,signal:state.signal,type:state.type,starred:state.starred?"1":""});
  const d=await (await fetch("/api/articles?"+p)).json();
  $("starredChip").classList.toggle("on",state.starred);
  $("count").textContent=`${d.total} article${d.total===1?"":"s"}`+(d.total>500?" (showing first 500)":"");
  loadStats();
  if(!d.articles.length){$("list").innerHTML='<div class="empty">No articles match. Try a wider date range, clear the filters, or press Fetch now.</div>';return;}
  $("list").innerHTML=d.articles.map(a=>{
    const segs=(a.segments||"").split(",").filter(Boolean).map(s=>`<span class="seg" style="background:var(--${s})">${SEG_LABEL[s]}</span>`).join("");
    const sigs=(a.signals||"").split(",").filter(Boolean).map(s=>`<span class="sig">${SIG_LABEL[s]}</span>`).join("");
    const provs=(a.provinces||"").split(",").filter(Boolean).map(s=>`<span class="prov">📍 ${esc(s)}</span>`).join("");
    const relb=a.relevance==="related"?'<span class="relb" title="Real estate is mentioned in the summary, not the headline">Related</span>':a.relevance==="off"?'<span class="relb" title="Not about real estate">Off-topic</span>':"";
    const also=(a.also||[]).length?`<div class="also">Also reported by: ${a.also.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.source)}</a>`).join(", ")}</div>`:"";
    const off=a.official?'<span class="off" title="Government source">🏛 Official</span>':"";
    const promo=a.promo?'<span class="promo" title="Looks like sponsored or sales copy">Promotional?</span>':"";
    const dt=a.published?new Date(a.published).toLocaleString([], {dateStyle:"medium",timeStyle:"short"}):"";
    return `<div class="art ${a.promo?"isPromo":""}"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">
      <button class="star ${a.starred?"on":""}" data-id="${a.id}" data-s="${a.starred}" title="Star">★</button>
      <div style="flex:1"><a class="t" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
      ${a.summary&&a.summary!==a.title?`<div class="s">${esc(a.summary)}</div>`:""}
      <div class="tags">${off}${promo}${relb}${a.score>0?`<span class="prio" title="Priority score">P${a.score}</span>`:""}${provs}${segs}${sigs}<span class="src">${esc(a.source)} · ${dt}</span></div>${also}</div></div></div>`;}).join("");
  $("list").querySelectorAll(".star").forEach(b=>b.onclick=async()=>{await post("/api/star",{id:+b.dataset.id,starred:b.dataset.s!=="1"});load();});
}

let t;$("q").oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};
["days","source","sort","area","promo","kind","rel","dups"].forEach(id=>$(id).onchange=load);
$("starredChip").onclick=()=>{state.starred=!state.starred;load();};
$("fetchBtn").onclick=async()=>{const b=$("fetchBtn");b.disabled=true;b.textContent="Fetching…";
  try{await post("/api/fetch",{});}finally{b.disabled=false;b.textContent="Fetch now";load();}};
$("addSrc").onclick=async()=>{
  const url=$("newUrl").value.trim();if(!url)return;
  const b=$("addSrc");b.disabled=true;b.textContent="Checking…";$("addResult").innerHTML="";
  try{
    const r=await fetch("/api/sources",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"add",url,name:$("newName").value,official:$("newOfficial").checked})});
    const d=await r.json();
    if(d.error){$("addResult").innerHTML=`<div class="notice err">Couldn't add it: ${esc(d.error)}</div>`;}
    else{
      $("addResult").innerHTML=`<div class="notice">Added <b>${esc(d.added.name)}</b> as ${d.added.type==="rss"?"an RSS feed":"a page reader"}, found ${d.found} articles, e.g.<br>`+
        d.sample.map(t=>"• "+esc(t)).join("<br>")+`<br>Press <b>Fetch now</b> to pull them in.</div>`;
      $("newUrl").value=$("newName").value="";$("newOfficial").checked=false;loadStats();
    }
  }finally{b.disabled=false;b.textContent="Add source";}
};
$("filterBtn").onclick=()=>$("filters").classList.toggle("open");
fetch("/api/info").then(r=>r.json()).then(d=>{ if(d.updated){$("count").insertAdjacentHTML("beforebegin",`<div class="meta">Updated ${new Date(d.updated).toLocaleString()}</div>`);} if(d.phone_url && !/Mobi/.test(navigator.userAgent)){
  $("phoneHint").style.display="block";
  $("phoneHint").innerHTML=`📱 On your phone (same Wi-Fi), open <b>${esc(d.phone_url)}</b>, then "Add to Home Screen".`;}});
load();
</script>
<script src="tools.js"></script>
</body>
</html>
