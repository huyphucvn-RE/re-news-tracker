name: Fetch news and publish phone page

on:
  schedule:
    - cron: "15 * * * *"   # every hour
  workflow_dispatch: {}     # "Run workflow" button for a manual refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all sources
        run: python tracker.py fetch
      - name: Build the phone page
        run: python tracker.py build-site
      - name: Save the article database
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add articles.db
          git commit -m "Fetch $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
